<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Design Option D — Black + Lime Clean</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { ink:'#0f172a', blackish:'#111827', lime:'#84cc16', grayline:'#e5e7eb' } } } }
    </script>
    <style>
      html{color-scheme:light}
      body{background:#f9fafb;color:#0f172a;font-family:Inter,system-ui,sans-serif}
      header{background:#ffffffb3;backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid #e5e7eb}
      .card{background:#fff;border:2px solid #111827;border-radius:20px;box-shadow:0 6px 0 #111827}
      .field{background:#fff;border:2px solid #111827;border-radius:12px;padding:14px}
      .btn{border-radius:12px;padding:12px 16px;border:2px solid #111827}
      .btn-primary{background:#111827;color:#fff}
      .btn-primary:disabled{opacity:.5;cursor:not-allowed}
      .pill{display:inline-flex;border-radius:9999px;border:2px solid #111827;gap:6px;padding:6px;background:#fff}
      .pill button{border-radius:9999px;padding:10px 16px;border:2px solid transparent;background:#fff;color:#111827;font-weight:700}
      .pill button.active{background:#111827;color:#fff}
      .chip{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;padding:6px 10px;border:2px solid #111827;background:#fff;color:#111827;font-size:12px}
      .dot{width:8px;height:8px;border-radius:9999px;background:#84cc16;display:inline-block}
    </style>
  </head>
  <body>
    <header class="sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="font-extrabold text-xl tracking-tight">Web2Speech</div>
        <nav class="hidden md:flex gap-6 text-sm text-ink"><a href="#input">Input</a><a href="#voices">Voices</a><a href="#preview">Preview</a></nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
      <section class="flex items-end justify-between gap-4">
        <div>
          <h1 class="text-4xl md:text-6xl font-black leading-tight">Turn text into audio</h1>
          <p class="mt-3 text-lg text-ink/80 max-w-2xl">Clean, fast, and focused. Paste a URL or upload a file to start.</p>
          <div class="mt-4 flex gap-8">
            <span class="chip"><span class="dot"></span>Realtime</span>
            <span class="chip"><span class="dot" style="background:#84cc16"></span>Accessible</span>
            <span class="chip"><span class="dot" style="background:#84cc16"></span>Clarity</span>
          </div>
        </div>
        <div class="hidden md:block text-right text-sm text-ink/70">PWA • Offline • Fast</div>
      </section>

      <!-- URL/File segmented toggle (URL default) -->
      <div class="pill w-fit">
        <button id="d-btn-url" class="active">URL</button>
        <button id="d-btn-file">File</button>
      </div>

      <section id="input" class="grid md:grid-cols-2 gap-6">
        <div id="d-url-card" class="card p-6">
          <div class="text-xl font-bold mb-3">URL</div>
          <div class="grid grid-cols-[1fr_auto] gap-3">
            <input placeholder="https://example.com/article" class="field"/>
            <button class="btn btn-primary">Extract</button>
          </div>
        </div>
        <div id="d-file-card" class="card p-6">
          <div class="text-xl font-bold mb-3">File</div>
          <label class="field h-28 grid place-items-center cursor-pointer bg-white">
            <input id="d-file" type="file" class="hidden"/>
            <span class="text-ink/80">Drag & drop or browse</span>
          </label>
        </div>
      </section>

      <section id="voices" class="card p-6">
        <div class="flex items-center justify-between mb-3">
          <div class="text-xl font-bold">Voice</div>
          <button class="btn">Test</button>
        </div>
        <div class="field text-ink/80">Choose a voice…</div>
      </section>

      <section id="preview" class="card p-6">
        <div class="flex items-center justify-between"><div class="text-xl font-bold">Preview</div><div class="text-sm text-ink/70">~3 min • 600 words</div></div>
        <div class="field mt-3 h-32 overflow-auto text-ink">Content snippet…</div>
      </section>

      <div class="sticky bottom-0 pt-6 bg-gradient-to-t from-[#f9fafb] to-transparent">
        <div class="card p-4 flex items-center justify-between">
          <div id="d-status" class="text-ink/80">Upload a file to enable Start</div>
          <div class="flex gap-2">
            <button id="d-start" disabled class="btn btn-primary">Start</button>
          </div>
        </div>
      </div>
    </main>

    <script>
      (function(){
        var mode='url';
        var btnUrl=document.getElementById('d-btn-url');
        var btnFile=document.getElementById('d-btn-file');
        var urlCard=document.getElementById('d-url-card');
        var fileCard=document.getElementById('d-file-card');
        function update(){
          urlCard.style.display = mode==='url'?'block':'none';
          fileCard.style.display = mode==='file'?'block':'none';
          btnUrl.classList.toggle('active', mode==='url');
          btnFile.classList.toggle('active', mode==='file');
        }
        btnUrl.addEventListener('click',function(){mode='url';update()});
        btnFile.addEventListener('click',function(){mode='file';update()});
        update();

        var fileInput=document.getElementById('d-file');
        var start=document.getElementById('d-start');
        var status=document.getElementById('d-status');
        fileInput.addEventListener('change',function(){
          if(fileInput.files && fileInput.files.length>0){
            start.disabled=false;
            status.textContent='File selected — you can Start now';
          }
        });
      })();
    </script>
  </body>
</html>
