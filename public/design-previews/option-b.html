<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Design Option B — Light Neo‑Brutalist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { ink:'#111827', paper:'#ffffff', mint:'#10b981', blue:'#2563eb' } } } }
    </script>
    <style>
      html{color-scheme:light}
      body{background:#f8fafc;color:#111827}
      .card{background:#ffffff;border:3px solid #111827;border-radius:20px;box-shadow:6px 6px 0 #111827}
      .btn{border:3px solid #111827;border-radius:14px;padding:12px 16px}
      .btn-primary{background:#2563eb;color:#fff}
      .btn-ghost{background:#fff}
      .field{background:#ffffff;border:3px solid #111827;border-radius:12px;padding:12px}
      header{border-bottom:3px solid #111827}
    </style>
  </head>
  <body>
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur">
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="text-2xl font-extrabold tracking-tight">Web2Speech</div>
        <nav class="hidden md:flex gap-4 text-sm">
          <a href="#input">Input</a><a href="#voices">Voices</a><a href="#mode">Mode</a>
        </nav>
        <button class="btn btn-ghost">About</button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10 space-y-8">
      <section class="flex items-end justify-between gap-4">
        <div>
          <h1 class="text-4xl md:text-6xl font-black leading-none">Turn text into audio</h1>
          <p class="mt-3 text-lg max-w-2xl">A crisp, bold interface with chunky borders and instant affordances.</p>
        </div>
        <div class="hidden md:block text-right text-sm">PWA • Installable • Fast</div>
      </section>

      <section id="input" class="grid md:grid-cols-2 gap-6">
        <div class="card p-6">
          <div class="text-xl font-bold mb-3">URL</div>
          <div class="grid grid-cols-[1fr_auto] gap-3">
            <input placeholder="https://example.com/article" class="field"/>
            <button class="btn btn-primary">Extract</button>
          </div>
        </div>
        <div class="card p-6">
          <div class="text-xl font-bold mb-3">File</div>
          <div class="field h-28 grid place-items-center">Drag & drop or browse</div>
        </div>
      </section>

      <section id="voices" class="card p-6">
        <div class="flex items-center justify-between mb-3">
          <div class="text-xl font-bold">Voice</div>
          <button class="btn btn-ghost">Test</button>
        </div>
        <div class="field">Choose a voice…</div>
      </section>

      <section id="mode" class="grid md:grid-cols-2 gap-6">
        <button class="card p-6 text-left hover:translate-y-[-2px] transition-transform">
          <div class="text-xl font-bold mb-1">Generate & Download</div>
          <div class="text-gray-700">Create audio files for offline listening.</div>
        </button>
        <button class="card p-6 text-left hover:translate-y-[-2px] transition-transform">
          <div class="text-xl font-bold mb-1">Read & Listen</div>
          <div class="text-gray-700">Interactive reader with synced playback.</div>
        </button>
      </section>

      <section id="preview" class="card p-6">
        <div class="flex items-center justify-between">
          <div class="text-xl font-bold">Preview</div>
          <div class="text-sm">~3 min • 600 words</div>
        </div>
        <div class="field mt-3 h-28 overflow-auto">Content snippet…</div>
      </section>

      <div class="sticky bottom-0 pt-6 bg-gradient-to-t from-white to-transparent">
        <div class="max-w-6xl mx-auto">
          <div class="card p-4 flex items-center justify-between">
            <div>Voice: Default • ~3 min</div>
            <div class="flex gap-2">
              <a href="#top" class="btn btn-ghost">Top</a>
              <button class="btn btn-primary">Start</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
