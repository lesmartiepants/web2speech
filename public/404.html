<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=/web2speech/">
    <script>
      // Client-side fallback for SPA deep links
      var path = location.pathname.replace(/^\//, '');
      var base = '/web2speech/';
      if (!location.pathname.startsWith(base)) {
        location.replace(base + (path ? ('#/' + path) : ''));
      }
    </script>
    <title>Redirecting…</title>
  </head>
  <body>Redirecting…</body>
</html>
