<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      (function() {
        // Derive base from current path (for GitHub Pages repo subpath) or Vite base if embedded
        var segments = location.pathname.split('/').filter(Boolean);
        // If served from user.github.io/repo, base is '/repo/'
        var base = segments.length > 0 ? ('/' + segments[0] + '/') : '/';
        // If already at the base index, just go there
        var dest = base;
        // Preserve the intended path via hash for SPA routers without server rewrite
        var path = location.pathname.replace(base, '');
        if (path) dest = base + '#/' + path + (location.search || '') + (location.hash || '');
        location.replace(dest);
      })();
    </script>
    <title>Redirecting…</title>
  </head>
  <body>Redirecting…</body>
</html>
